# =============================================================================
# Nginx конфигурация для Docker-контейнера
# =============================================================================

# Глобальные настройки
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # =============================================================================
    # Базовые настройки
    # =============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Скрыть версию Nginx

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # =============================================================================
    # Upstream: наше Spring Boot приложение
    # =============================================================================
    upstream backend {
        server app:8080;  # 'app' — имя сервиса из docker-compose.yml
        keepalive 32;
    }

    # =============================================================================
    # HTTP → HTTPS redirect
    # =============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name messenger-api.ru www.messenger-api.ru;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # =============================================================================
    # HTTPS сервер
    # =============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name messenger-api.ru www.messenger-api.ru;

        # =============================================================================
        # SSL сертификаты (монтируются из /etc/letsencrypt на хосте)
        # =============================================================================
        ssl_certificate /etc/letsencrypt/live/messenger-api.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messenger-api.ru/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/messenger-api.ru/chain.pem;

        # Безопасные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # =============================================================================
        # Заголовки безопасности
        # =============================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # =============================================================================
        # CORS заголовки (для API)
        # =============================================================================
        # Для WebSocket и API эндпоинтов
        location ~ ^/(api|ws|actuator) {
            # Разрешённые origins
            if ($http_origin ~* ^(https://(?:.*\.)?messenger-api\.ru|http://localhost(?:|:\d+))$) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
            }

            # Preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Проксирование на backend
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket поддержка
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Буферы
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # =============================================================================
        # Статические файлы (если будут)
        # =============================================================================
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # =============================================================================
        # Health check endpoint для балансировщиков
        # =============================================================================
        location /health {
            access_log off;
            proxy_pass http://backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # =============================================================================
        # Fallback: всё остальное → backend
        # =============================================================================
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =============================================================================
        # Страницы ошибок
        # =============================================================================
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;
        location = /errors/50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
