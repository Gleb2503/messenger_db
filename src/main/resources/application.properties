server.port=8080

# Database (local defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/messenger_db
spring.datasource.username=${DB_USERNAME:gfedorov}
spring.datasource.password=${DB_PASSWORD:270105}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog_master.xml

# JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (local default)
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnly1234567890!@#$%^&*()}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Yandex Cloud (????? ??????????)
cloud.storage.endpoint=https://storage.yandexcloud.net
cloud.storage.bucket=${YANDEX_BUCKET:messenger-attachments}
cloud.storage.access-key=${YANDEX_ACCESS_KEY}
cloud.storage.secret-key=${YANDEX_SECRET_KEY}
cloud.storage.region=ru-central1
cloud.storage.public-url=https://storage.yandexcloud.net/${YANDEX_BUCKET:messenger-attachments}

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.software.amazon.awssdk=DEBUG

# CORS (local)
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
app.cors.allow-credentials=true
app.cors.max-age=3600