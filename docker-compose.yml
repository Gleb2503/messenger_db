version: '3.8'

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: host.docker.internal
  DB_PORT: 5432
  DB_NAME: messenger_db
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: 3600000
  JWT_REFRESH_EXPIRATION: 604800000
  CLOUD_STORAGE_ENDPOINT: https://storage.yandexcloud.net
  CLOUD_STORAGE_BUCKET: ${YANDEX_BUCKET}
  CLOUD_STORAGE_ACCESS_KEY: ${YANDEX_ACCESS_KEY}
  CLOUD_STORAGE_SECRET_KEY: ${YANDEX_SECRET_KEY}
  CLOUD_STORAGE_REGION: ru-central1
  LOGGING_FILE_PATH: /app/logs
  LOGGING_FILE_NAME: /app/logs/app.log
  APP_CORS_ALLOWED_ORIGINS: https://messenger-api.ru,https://www.messenger-api.ru

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - messenger-backend:latest
    container_name: messenger-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      <<: *common-env
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs:z
    networks:
      - messenger-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service"
        compress: "true"

  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - messenger-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

networks:
  messenger-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
